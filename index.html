<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Authorization Screen Styles */
        #auth-screen {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        #auth-screen h2 {
            margin-top: 0;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }

        .input-group input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .checkbox-group input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error-msg {
            color: red;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        /* Upload Screen Styles (Hidden by default) */
        #upload-screen {
            display: none;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }

        .logout-btn {
            background-color: #dc3545;
            margin-top: 20px;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <!-- Authorization Screen -->
    <div id="auth-screen">
        <h2>Secure Login</h2>
        <div class="error-msg" id="error-msg">Incorrect password. Please try again.</div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember me</label>
        </div>
        
        <button onclick="login()">Login</button>
    </div>

    <!-- Main Upload Screen -->
    <div id="upload-screen">
        <h2>Upload Dashboard</h2>
        <p>Welcome! You can now upload your files here.</p>
        
        <!-- Place your upload logic/form here -->
        <input type="file" style="margin: 20px 0;">
        
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script>
        // "Sardor26" reversed is "62rodraS", then encoded to Base64 = "NjJyb2RyYVM="
        // This keeps the password out of plain text in the source code.
        const ENCODED_PASS = "NjJyb2RyYVM=";

        // Elements
        const authScreen = document.getElementById('auth-screen');
        const uploadScreen = document.getElementById('upload-screen');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember-me');
        const errorMsg = document.getElementById('error-msg');

        // Check local storage on page load
        window.onload = function() {
            if (localStorage.getItem('isAuthorized') === 'true') {
                showUploadScreen();
            }
        };

        function login() {
            const inputVal = passwordInput.value;
            
            // Encode input using the same logic: reverse string -> convert to base64
            const encodedInput = btoa(inputVal.split('').reverse().join(''));

            if (encodedInput === ENCODED_PASS) {
                // Correct password
                errorMsg.style.display = 'none';
                
                if (rememberCheckbox.checked) {
                    localStorage.setItem('isAuthorized', 'true');
                } else {
                    // Optional: use sessionStorage if you want to remember just for the tab lifetime
                    sessionStorage.setItem('isAuthorized', 'true'); 
                }
                
                showUploadScreen();
            } else {
                // Incorrect password
                errorMsg.style.display = 'block';
                passwordInput.value = ''; // clear input
            }
        }

        function logout() {
            // Clear storage and reset UI
            localStorage.removeItem('isAuthorized');
            sessionStorage.removeItem('isAuthorized');
            passwordInput.value = '';
            rememberCheckbox.checked = false;
            
            uploadScreen.style.display = 'none';
            authScreen.style.display = 'block';
        }

        function showUploadScreen() {
            authScreen.style.display = 'none';
            uploadScreen.style.display = 'block';
        }

        // Allow pressing "Enter" to submit password
        passwordInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                login();
            }
        });
    </script>
</body>
</html>
